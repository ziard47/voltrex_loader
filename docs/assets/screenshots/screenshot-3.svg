<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d14"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>
    <pattern id="grid3" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg3)"/>
  <rect width="1920" height="1080" fill="url(#grid3)"/>

  <!-- Dimmed Desktop Background -->
  <rect x="80" y="60" width="1760" height="960" rx="16" fill="#0d111a" opacity="0.6"/>

  <!-- Modal Dialog Window Frame -->
  <rect x="560" y="160" width="800" height="760" rx="14" fill="#141a26" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <rect x="560" y="160" width="800" height="60" rx="14" fill="#1b2333"/>
  <text x="600" y="198" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="700">Add New Download — Server Range Probing</text>

  <!-- URL Input Bar -->
  <rect x="600" y="250" width="720" height="50" rx="6" fill="#0c1017" stroke="rgba(255,255,255,0.15)"/>
  <text x="620" y="282" fill="#94a3b8" font-family="JetBrains Mono, monospace" font-size="14">https://releases.ubuntu.com/24.04/ubuntu-24.04-desktop-amd64.iso</text>

  <!-- Probe Result Matrix -->
  <rect x="600" y="330" width="720" height="250" rx="8" fill="#0e131d" stroke="rgba(255,255,255,0.08)"/>
  <text x="630" y="375" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="14">HTTP Response:</text>
  <text x="820" y="375" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">200 OK (Host Online)</text>

  <text x="630" y="420" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="14">Accept-Ranges:</text>
  <text x="820" y="420" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">bytes (Multi-Thread Resumable ✅)</text>

  <text x="630" y="465" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="14">Content-Length:</text>
  <text x="820" y="465" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="14">5,842,918,400 bytes (5.44 GB)</text>

  <text x="630" y="510" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="14">Target Directory:</text>
  <text x="820" y="510" fill="#f8fafc" font-family="JetBrains Mono, monospace" font-size="14">~/Downloads/Linux_ISOs/ (Auto-Categorized)</text>

  <text x="630" y="555" fill="#64748b" font-family="JetBrains Mono, monospace" font-size="14">Socket Streams:</text>
  <text x="820" y="555" fill="#0284c7" font-family="JetBrains Mono, monospace" font-size="14" font-weight="700">16 Concurrent Threads (Configurable up to 32)</text>

  <!-- Centered Placeholder Watermark -->
  <g transform="translate(960, 720)">
    <rect x="-280" y="-60" width="560" height="120" rx="12" fill="#090c13" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <text x="0" y="-15" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="20" font-weight="700" text-anchor="middle">URL Probe &amp; Range Setup Modal</text>
    <text x="0" y="16" fill="#10b981" font-family="JetBrains Mono, monospace" font-size="14" font-weight="600" text-anchor="middle">Placeholder Screenshot #3</text>
    <text x="0" y="38" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" text-anchor="middle">Drop "screenshot-3.png" into web/assets/screenshots/</text>
  </g>
</svg>
