<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0f17"/>
      <stop offset="100%" stop-color="#141924"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>

  <!-- Window Frame Mockup -->
  <rect x="80" y="60" width="1760" height="960" rx="16" fill="#111622" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  <rect x="80" y="60" width="1760" height="54" rx="16" fill="#171e2c"/>
  <circle cx="120" cy="87" r="7" fill="#ef4444"/>
  <circle cx="145" cy="87" r="7" fill="#f59e0b"/>
  <circle cx="170" cy="87" r="7" fill="#10b981"/>
  <text x="210" y="93" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" font-weight="600">Voltrex Loader — Main Dashboard &amp; Live Telemetry</text>

  <!-- Sidebar Wireframe -->
  <rect x="80" y="114" width="280" height="906" fill="#0d121a" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <rect x="110" y="150" width="220" height="36" rx="6" fill="rgba(229,57,53,0.15)"/>
  <rect x="110" y="200" width="220" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>
  <rect x="110" y="250" width="220" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>
  <rect x="110" y="320" width="180" height="18" rx="4" fill="rgba(255,255,255,0.08)"/>
  <rect x="110" y="360" width="220" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>
  <rect x="110" y="410" width="220" height="36" rx="6" fill="rgba(255,255,255,0.03)"/>

  <!-- Main Area -->
  <rect x="390" y="140" width="1420" height="80" rx="8" fill="#161c28" stroke="rgba(255,255,255,0.06)"/>
  <text x="430" y="188" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="28" font-weight="800">54.8 MB/s</text>
  <text x="590" y="188" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16">Total Speed (3 Active Tasks • 32 Sockets)</text>

  <!-- Table Wireframe -->
  <rect x="390" y="250" width="1420" height="730" rx="8" fill="#141924" stroke="rgba(255,255,255,0.06)"/>
  <rect x="390" y="250" width="1420" height="50" rx="8" fill="#19202e"/>
  
  <!-- Rows -->
  <rect x="420" y="330" width="1360" height="80" rx="6" fill="#19202f" stroke="rgba(255,255,255,0.05)"/>
  <rect x="420" y="430" width="1360" height="80" rx="6" fill="#171d2a" stroke="rgba(255,255,255,0.05)"/>
  <rect x="420" y="530" width="1360" height="80" rx="6" fill="#171d2a" stroke="rgba(255,255,255,0.05)"/>

  <!-- Centered Placeholder Watermark -->
  <g transform="translate(960, 680)">
    <rect x="-280" y="-70" width="560" height="140" rx="12" fill="#090c13" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
    <text x="0" y="-20" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Main Dashboard &amp; Telemetry</text>
    <text x="0" y="15" fill="#e53935" font-family="JetBrains Mono, monospace" font-size="15" font-weight="600" text-anchor="middle">Placeholder Screenshot #1</text>
    <text x="0" y="42" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13" text-anchor="middle">Drop "screenshot-1.png" into web/assets/screenshots/</text>
  </g>
</svg>
