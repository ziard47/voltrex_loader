<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Voltrex Loader</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    try {
      var c = JSON.parse(localStorage.getItem('voltrex_theme_cache'));
      var isWindowsLegacy = c && c.windowsLegacy !== undefined ? c.windowsLegacy : true;
      if (isWindowsLegacy) {
        document.documentElement.classList.add('windows-legacy');
      }
      var isDark = c ? (c.themeMode === 'light' ? false : (c.themeMode === 'dark' ? true : window.matchMedia('(prefers-color-scheme: dark)').matches)) : true;
      if (isDark) {
        document.documentElement.classList.add('dark');
        document.documentElement.classList.remove('light');
        document.documentElement.setAttribute('data-mode', 'dark');
      } else {
        document.documentElement.classList.add('light');
        document.documentElement.classList.remove('dark');
        document.documentElement.setAttribute('data-mode', 'light');
      }
    } catch (e) {}
  </script>
</head>
<body class="bg-[#1D1616] text-[#EEEEEE] overflow-hidden select-none">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
